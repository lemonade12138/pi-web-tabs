<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Pi Web 启动中</title>
<style>
  html,body { margin:0; height:100%; background:transparent; }
  body {
    display:flex;
    font-family:"Microsoft YaHei",system-ui,sans-serif;
  }
  .frame {
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    background:#ffffff; color:#1a1a1a;
  }
  @media (prefers-color-scheme: dark) {
    .frame { background:#1a1a1a; color:#e8e8e8; }
  }
  .logo { font-size:44px; font-weight:700; }
  .logo span { font-weight:400; }
  .bar { width:180px; height:4px; border-radius:99px; background:rgba(128,128,128,.25); overflow:hidden; }
  .bar i { display:block; width:40%; height:100%; border-radius:99px; background:#2563eb; animation:slide 1.1s ease-in-out infinite; }
  @keyframes slide { 0%{transform:translateX(-100%)} 100%{transform:translateX(350%)} }
  .tip { font-size:13px; opacity:.65; }
  .err { font-size:13px; color:#f87171; max-width:80%; text-align:center; white-space:pre-wrap; }
  /* 窗口按钮：右上角三个，任何情况下都可见 */
  .winbtns { position:fixed; top:0; right:0; display:flex; height:36px; z-index:999; }
  .winbtns button {
    width:42px; border:none; background:transparent; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    color:inherit; opacity:.72;
  }
  .winbtns button:hover { background:rgba(128,128,128,.16); opacity:1; }
  .winbtns button.wb-close:hover { background:#e81123; color:#fff; }
  .winbtns svg { pointer-events:none; }
</style>
</head>
<body>
  <div class="frame">
    <div class="logo">π <span>Pi Web</span></div>
    <div class="bar"><i></i></div>
    <div class="tip" id="tip">正在启动本地服务…</div>
    <div class="err" id="err"></div>
  </div>
  <div class="winbtns">
    <button id="wb-min" aria-label="最小化" title="最小化">
      <svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"><line x1="2" y1="6" x2="10" y2="6"/></svg>
    </button>
    <button id="wb-max" aria-label="最大化/还原" title="最大化/还原">
      <svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"><rect x="2.5" y="2.5" width="7" height="7" rx="1"/></svg>
    </button>
    <button id="wb-close" class="wb-close" aria-label="关闭" title="关闭">
      <svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"><line x1="2.5" y1="2.5" x2="9.5" y2="9.5"/><line x1="9.5" y1="2.5" x2="2.5" y2="9.5"/></svg>
    </button>
  </div>
  <script>
    // 窗口控制（本地启动页，__TAURI__ 必然注入）
    (function () {
      var win = null;
      function gw() {
        try {
          if (!win && window.__TAURI__ && window.__TAURI__.window) win = window.__TAURI__.window.getCurrentWindow();
        } catch (_) {}
        return win;
      }
      var min = document.getElementById("wb-min");
      var max = document.getElementById("wb-max");
      var clo = document.getElementById("wb-close");
      if (min) min.onclick = function () { var w = gw(); if (w) w.minimize(); };
      if (max) max.onclick = function () { var w = gw(); if (w) w.toggleMaximize(); };
      if (clo) clo.onclick = function () { var w = gw(); if (w) w.close(); };
    })();

    window.addEventListener("pi-web:desktop-status", (e) => {
      const d = e.detail || {};
      if (d.tip) document.getElementById("tip").textContent = d.tip;
      if (d.error) document.getElementById("err").textContent = d.error;
      if (d.ready) {
        document.getElementById("tip").textContent = "已就绪，正在进入…";
        setTimeout(() => location.replace("http://127.0.0.1:30142"), 400);
      }
    });
    // 服务器未就绪时拖入的文件：暂存到 sessionStorage，应用加载后补投递
    window.addEventListener("pi-web:external-file-paths", (e) => {
      try {
        const paths = (e.detail && e.detail.paths) || [];
        if (paths.length) sessionStorage.setItem("pi-web:pending-drop-paths", JSON.stringify(paths));
      } catch (_) { /* 隐私模式等场景下静默降级 */ }
    });
  </script>
</body>
</html>
